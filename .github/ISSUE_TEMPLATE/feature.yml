name: Feature
description: Suggest something
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please check the [non-goals](../../blob/main/README.md#non-goals) first —
        some things are deliberately not being built.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The problem, not the solution. What does the current version make hard?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you had in mind
    validations:
      required: false
